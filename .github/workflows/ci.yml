name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Every job runs against the embedded test database and simulated payments.
# No secret is needed and no external service is contacted.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SKIP_LEGACY_IMPORT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e -- --trace off

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
